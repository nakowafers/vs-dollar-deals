<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Vitamin Shoppe $1 Dollar Deals</title>
  <meta name="description" content="This week's Vitamin Shoppe $1 energy drink deals. Updated weekly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #111827;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }

    /* ---- Layout ---- */
    .page { width: 100%; min-height: 100dvh; padding-bottom: 120px; }
    .container { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 16px; }

    /* ---- Typography ---- */
    .eyebrow {
      font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #6b7280;
    }
    .price {
      font-family: 'Fraunces', Georgia, serif; font-weight: 700; line-height: 1; letter-spacing: -0.03em;
    }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 52px; padding: 14px 20px; border-radius: 12px;
      font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer;
      border: 0; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
      .btn:active { transform: translateY(1px); }
    .btn:focus-visible, a:focus-visible { outline: 2px solid #0a3050; outline-offset: 2px; }
    .btn-primary { background: #0a3050; color: #fff; box-shadow: 0 8px 20px rgba(10, 48, 80, 0.22); }
    .btn-primary:hover { background: #08243c; }
    .btn-secondary { background: transparent; color: #0a3050; border: 1px solid #0a3050; }
    .btn-secondary:hover { background: #eef3f7; }

    .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.8); }
    .btn-ghost:hover { background: rgba(255,255,255,0.15); border-color: #fff; }
    .btn-ghost:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* ============================
       CLEAN SCAN STYLES
       ============================ */
    .clean-scan { background: #ffffff; color: #111827; }

    .cs-header {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 20px 0 18px;
    }
    .cs-header-top {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
    }
    .cs-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(1.7rem, 6vw, 2.4rem);
      font-weight: 700; line-height: 1.05; letter-spacing: -0.02em;
    }
    .cs-dates {
      font-size: 12px; font-weight: 700; color: #146c3a; white-space: nowrap;
      padding: 6px 10px; background: #ecfdf5; border-radius: 999px;
    }
    .cs-last-updated {
      font-size: 11px; color: #6b7280; margin-top: 8px;
    }

    .cs-list { margin-top: 16px; }

    .cs-row {
      display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: center;
      padding: 20px 0; border-bottom: 1px solid #e5e7eb;
    }
    .cs-row:first-child { border-top: 1px solid #e5e7eb; }
    .cs-row-featured {
      background: #0b2e1a; color: #eafff1; border-radius: 14px;
      margin: 16px -16px 0; padding: 20px 16px; border-bottom: none;
    }
    .cs-row-featured + .cs-row { margin-top: 16px; }

    .cs-price {
      grid-row: 1 / span 2; align-self: center; width: 76px; height: 76px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px; background: #101418; color: #fff; font-size: 2rem; letter-spacing: -0.03em;
    }
    .cs-row-featured .cs-price { background: #146c3a; color: #fff; }

    .cs-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    .cs-brand-row { display: flex; gap: 8px; align-items: center; }

    .cs-brand {
      font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6b7280; margin-bottom: 4px;
    }
    .cs-row-featured .cs-brand { color: rgba(234, 255, 241, 0.7); }

    .cs-name { font-size: 1.05rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }

    .cs-meta { font-size: 0.86rem; color: #6b7280; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cs-row-featured .cs-meta { color: rgba(234, 255, 241, 0.7); }

    .cs-limit { font-size: 12px; font-weight: 700; color: #146c3a; margin-top: 8px; }
    .cs-row-featured .cs-limit { color: #86efac; }

    .cs-actions { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 4px; }
    .cs-actions .btn { flex: 1; min-height: 48px; font-size: 14px; border-radius: 10px; }

    .cs-summary {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 20px; padding: 14px 0; border-top: 2px solid #111827;
    }
    .cs-summary-label { font-size: 14px; font-weight: 700; }
    .cs-summary-total {
      font-family: 'Fraunces', Georgia, serif; font-size: 1.4rem; font-weight: 700; color: #0b7a3b;
    }

    /* ---- Empty State ---- */
    .empty-state {
      text-align: center; padding: 60px 20px; color: #6b7280;
    }
    .empty-state .eyebrow { margin-bottom: 16px; display: inline-block; }
    .empty-state h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700; line-height: 1.2; margin: 16px 0 12px;
    }
    .empty-state p { font-size: 1rem; max-width: 40ch; margin: 0 auto 24px; }
    .empty-state .btn { min-width: 200px; }

    /* ---- Footer / Attribution ---- */
    .footer {
      margin-top: 40px; padding: 20px 0; text-align: center;
      font-size: 12px; color: #6b7280; border-top: 1px solid #e5e7eb;
    }
    .footer a { color: #0a3050; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }

    /* ---- Responsive ---- */
    @media (max-width: 767px) {
      .page { padding-bottom: 64px; }
      .cs-row { grid-template-columns: 72px 1fr; }
      .cs-price { width: 64px; height: 64px; font-size: 1.6rem; }
      .cs-row-featured { margin: 16px -16px 0; padding: 16px 16px; }
      .cs-actions { flex-direction: column; }
      .cs-actions .btn { width: 100%; }
    }
  </style>
</head>
<body class="clean-scan">

  <div class="page">
    <div class="container">

      <!-- Header -->
      <header class="cs-header">
        <div class="cs-header-top">
          <div class="eyebrow">Vitamin Shoppe</div>
          <h1 class="cs-title">Dollar Deals</h1>
          <time id="deal-dates" class="cs-dates">—</time>
        </div>
        <p id="last-updated" class="cs-last-updated" aria-live="polite"></p>
      </header>

      <!-- Deal List -->
      <div id="deal-list" class="cs-list" role="list" aria-label="Current dollar deals">
        <!-- Hydrated by JS -->
      </div>

      <!-- Empty State (hidden by default) -->
      <div id="empty-state" class="empty-state" hidden>
        <div class="eyebrow">Vitamin Shoppe</div>
        <h1>No active deals this week</h1>
        <p>Check back Thursday for the next $1 energy drink drop. Deals run Thursday through Sunday.</p>
        <a href="https://www.vitaminshoppe.com" target="_blank" rel="noopener" class="btn btn-primary">Browse Vitamin Shoppe</a>
      </div>

      <!-- Summary (only shown when deals exist) -->
      <div id="summary" class="cs-summary" hidden>
        <span class="cs-summary-label"><span id="deal-count">0</span> offers available</span>
        <span class="cs-summary-total">from <span id="min-price">$1</span></span>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>Data sourced from <a href="https://locations.vitaminshoppe.com/" target="_blank" rel="noopener">Vitamin Shoppe locations</a> · Updated weekly</p>
      </footer>
    </div>
  </div>

  <script>
    (function() {
      // Fetch and hydrate deals from deals.json
      async function loadDeals() {
        try {
          const res = await fetch('deals.json?t=' + Date.now());
          if (!res.ok) throw new Error('Failed to load deals.json');
          const data = await res.json();
          hydrate(data);
        } catch (err) {
          console.error('Deal load error:', err);
          showEmptyState();
        }
      }

      function hydrate(data) {
        const list = document.getElementById('deal-list');
        const empty = document.getElementById('empty-state');
        const summary = document.getElementById('summary');
        const datesEl = document.getElementById('deal-dates');
        const updatedEl = document.getElementById('last-updated');
        const countEl = document.getElementById('deal-count');
        const minPriceEl = document.getElementById('min-price');

        if (!data.has_active_deal || !data.deals?.length) {
          showEmptyState();
          return;
        }

        // Show deals, hide empty state
        empty.hidden = true;
        summary.hidden = false;
        list.innerHTML = '';

        // Header dates from first deal
        const firstDeal = data.deals[0];
        datesEl.textContent = firstDeal.deal_dates || 'Thu–Sun';
        datesEl.dateTime = firstDeal.deal_dates || '';

        // Last updated
        if (data.updated_at) {
          const dt = new Date(data.updated_at);
          updatedEl.textContent = 'Updated ' + dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Summary
        countEl.textContent = data.deals.length;
        const prices = data.deals.map(d => parseFloat(d.deal_price?.replace(/[^\d.]/g, '')) || 0);
        minPriceEl.textContent = '$' + Math.min(...prices).toFixed(2);

        // Render each deal
        data.deals.forEach((deal, idx) => {
          const isFeatured = idx === 0;
          const row = document.createElement('div');
          row.className = 'cs-row' + (isFeatured ? ' cs-row-featured' : '');
          row.setAttribute('role', 'listitem');

          const priceNum = deal.deal_price?.replace(/[^\d.]/g, '') || '1';
          const searchUrl = 'https://www.vitaminshoppe.com/search?search=' + encodeURIComponent(deal.product_name || deal.brand || 'energy drink');

          // Price block
          const priceEl = document.createElement('div');
          priceEl.className = 'cs-price';
          priceEl.setAttribute('aria-hidden', 'true');
          priceEl.textContent = '$' + priceNum;
          row.appendChild(priceEl);

          // Info column
          const infoEl = document.createElement('div');

          // Brand and thumbnail wrapper
          const brandImageWrapper = document.createElement('div');
          brandImageWrapper.className = 'cs-brand-row';

          const brandDiv = document.createElement('div');
          brandDiv.className = 'cs-brand';
          brandDiv.textContent = deal.brand || 'Featured';
          brandImageWrapper.appendChild(brandDiv);

          // Add thumbnail if image_url exists
          if (deal.image_url) {
            const imgEl = document.createElement('img');
            imgEl.className = 'cs-thumb';
            imgEl.src = deal.image_url;
            imgEl.alt = deal.product_name || (deal.brand + ' Energy Drink');
            imgEl.loading = 'lazy';
            imgEl.width = 48;
            imgEl.height = 48;
            brandImageWrapper.appendChild(imgEl);
          }

          infoEl.appendChild(brandImageWrapper);

          // Product name, details, limit
          [
            { key: 'product_name', cls: 'cs-name', fallback: deal.brand + ' Energy Drink' },
            { key: 'details', cls: 'cs-meta', fallback: '' },
            { key: 'limit', cls: 'cs-limit', fallback: 'Limit 6 per customer' },
          ].forEach(({ key, cls, fallback }) => {
            const div = document.createElement('div');
            div.className = cls;
            div.textContent = deal[key] || fallback;
            infoEl.appendChild(div);
          });

          row.appendChild(infoEl);

          // Actions
          const actionsEl = document.createElement('div');
          actionsEl.className = 'cs-actions';
          
          const findLink = document.createElement('a');
          findLink.href = searchUrl;
          findLink.target = '_blank';
          findLink.rel = 'noopener';
          findLink.className = 'btn ' + (isFeatured ? 'btn-primary' : 'btn-secondary');
          findLink.textContent = 'Find in Store';
          actionsEl.appendChild(findLink);

          if (isFeatured) {
            const shareBtn = document.createElement('button');
            shareBtn.type = 'button';
            shareBtn.setAttribute('aria-label', 'Share this deal');
            shareBtn.dataset.url = searchUrl;
            shareBtn.dataset.title = deal.product_name || deal.brand + ' Energy Drink';
            shareBtn.className = 'btn btn-ghost';
            actionsEl.appendChild(shareBtn);
          }

          row.appendChild(actionsEl);
          list.appendChild(row);
        });

        // Wire up share buttons
        list.querySelectorAll('.share-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const url = btn.dataset.url;
            const title = btn.dataset.title;
            if (navigator.share) {
              try { await navigator.share({ title: title + ' - Vitamin Shoppe Deal', url }); } catch {}
            } else {
              await navigator.clipboard.writeText(url);
              const original = btn.textContent;
              btn.textContent = 'Copied!';
              setTimeout(() => btn.textContent = original, 1500);
            }
          });
        });
      }

      function showEmptyState() {
        document.getElementById('deal-list').innerHTML = '';
        document.getElementById('empty-state').hidden = false;
        document.getElementById('summary').hidden = true;
        document.getElementById('deal-dates').textContent = '—';
        document.getElementById('last-updated').textContent = '';
      }

      // Load on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadDeals);
      } else {
        loadDeals();
      }
    })();
  </script>
</body>
</html>
