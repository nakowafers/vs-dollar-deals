<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitamin Shoppe $1 Dollar Deals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #d4d0c8;
      font-family: 'Geneva', 'Verdana', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .mac-window {
      width: 100%;
      max-width: 340px;
      border: 2px solid #000;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
    }

    .mac-titlebar {
      background: linear-gradient(to right, #000080, #1084d0);
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #000;
    }

    .mac-titlebar-text {
      color: white;
      font-size: 13px;
      font-weight: bold;
    }

    .mac-buttons {
      display: flex;
      gap: 5px;
    }

    .mac-btn {
      width: 14px;
      height: 14px;
      background: #c0c0c0;
      border: 1px solid #808080;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #000;
      cursor: pointer;
      box-shadow: inset 1px 1px 0 #fff;
    }

    .mac-card {
      background: white;
      border: 2px solid #808080;
      border-top: none;
      padding: 20px;
      box-shadow: inset 1px 1px 0 #dfdfdf;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .header-badge {
      color: #000080;
      font-weight: bold;
    }

    .header-date {
      color: #804000;
      font-weight: bold;
    }

    .product-image-container {
      background: #f5f5f5;
      border: 2px solid #808080;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: inset 1px 1px 0 #fff;
      text-align: center;
    }

    .product-image {
      width: 140px;
      height: 140px;
      object-fit: contain;
      border: 1px dashed #808080;
      border-radius: 4px;
      background: #e8e8e8;
    }

    .product-image-placeholder {
      width: 140px;
      height: 140px;
      margin: 0 auto;
      background: linear-gradient(135deg, #e0e0e0, #c0c0c0);
      border: 1px dashed #808080;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 12px;
    }

    .brand-block {
      text-align: center;
      margin-bottom: 16px;
    }

    .brand-label {
      font-size: 11px;
      color: #666;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .brand-name {
      font-size: 32px;
      font-weight: 900;
      color: #000;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .product-subtitle {
      font-size: 14px;
      color: #333;
    }

    .price-container {
      text-align: center;
      margin-bottom: 16px;
    }

    .price-frame {
      display: inline-block;
      background: #c0c0c0;
      border: 2px solid #808080;
      border-radius: 4px;
      padding: 3px;
      box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #404040;
    }

    .price-inner {
      background: white;
      padding: 12px 32px;
      border: 1px solid #808080;
      border-radius: 2px;
    }

    .price-amount {
      font-size: 48px;
      font-weight: 900;
      color: #000080;
      line-height: 1;
    }

    .price-limit {
      display: block;
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .companion-deal {
      background: #f0f0f0;
      border: 2px solid #808080;
      border-radius: 4px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: inset 1px 1px 0 #fff;
    }

    .companion-name {
      font-size: 13px;
      color: #000;
      font-weight: 500;
    }

    .companion-price {
      color: #000080;
      font-weight: 700;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #c0c0c0;
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 14px;
      border: 2px solid #808080;
      border-radius: 4px;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      min-height: 44px;
      box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #404040;
      font-family: inherit;
      letter-spacing: 0.03em;
    }

    .btn:hover {
      background: #d0d0d0;
    }

    .btn:active {
      box-shadow: inset -1px -1px 0 #fff, inset 1px 1px 0 #404040;
    }

    .btn-secondary {
      background: #c0c0c0;
      font-weight: 500;
    }

    .btn:focus-visible, .mac-btn:focus-visible {
      outline: 2px solid #000080;
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <main class="mac-window">
    <div class="mac-titlebar">
      <span class="mac-titlebar-text">$1 Dollar Deals</span>
      <div class="mac-buttons" aria-hidden="true">
        <span class="mac-btn">−</span>
        <span class="mac-btn">□</span>
        <span class="mac-btn">×</span>
      </div>
    </div>

    <div class="mac-card">
      <div class="card-header">
        <span class="header-badge">★ WEEKEND DROP ★</span>
        <span id="dealDatesBadge" class="header-date">THU–SUN</span>
      </div>

      <div class="product-image-container">
        <img id="productImage" class="product-image" src="" alt="Product image" style="display: none;">
        <div id="productImagePlaceholder" class="product-image-placeholder">[ Product Image ]</div>
      </div>

      <div class="brand-block">
        <p class="brand-label">THE VITAMIN SHOPPE</p>
        <h1 id="brandName" class="brand-name">JOCKO GO</h1>
        <p id="productSubtitle" class="product-subtitle">Clean Energy & Focus Drink (12 oz)</p>
      </div>

      <div class="price-container">
        <div class="price-frame">
          <div class="price-inner">
            <span id="dealPrice" class="price-amount">$1.00</span>
            <span id="dealLimitText" class="price-limit">PER CAN · LIMIT 6 / DAY</span>
          </div>
        </div>
      </div>

      <div class="companion-deal">
        <span id="companionText" class="companion-name">🥛 Jocko Molk RTD Shake</span>
        <span class="companion-price">$2.00</span>
      </div>

      <div class="actions">
        <a id="findStoreLink" href="https://www.vitaminshoppe.com/search?search=Jocko%20Go%20Energy%20Drink" target="_blank" class="btn">
          <span>Find in Store / Online</span>
          <span>↗</span>
        </a>
        <button id="copyShareBtn" class="btn btn-secondary">
          <span id="copyBtnLabel">📋 Copy Deal to Share</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    async function loadDealsData() {
      try {
        const res = await fetch('deals.json');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.deals && data.deals.length > 0) {
          const primary = data.deals[0];
          const productName = primary.product_name || `${primary.brand} Energy Drink`;
          
          document.getElementById('brandName').innerText = primary.brand || 'JOCKO GO';
          document.getElementById('productSubtitle').innerText = productName;
          document.getElementById('dealPrice').innerText = primary.deal_price || '$1.00';
          if (primary.limit) document.getElementById('dealLimitText').innerText = `PER CAN · ${primary.limit.toUpperCase()}`;
          if (primary.deal_dates) document.getElementById('dealDatesBadge').innerText = primary.deal_dates;

          const searchUrl = `https://www.vitaminshoppe.com/search?search=${encodeURIComponent(productName)}`;
          document.getElementById('findStoreLink').href = searchUrl;

          const img = document.getElementById('productImage');
          const placeholder = document.getElementById('productImagePlaceholder');
          if (primary.image_url) {
            img.src = primary.image_url;
            img.alt = `${primary.brand} product image`;
            img.onload = function() {
              img.style.display = 'block';
              placeholder.style.display = 'none';
            };
            img.onerror = function() {
              img.style.display = 'none';
              placeholder.style.display = 'flex';
            };
          }

          if (data.deals.length > 1) {
            const secondary = data.deals[1];
            document.getElementById('companionText').innerText = `🥛 ${secondary.product_name || secondary.brand}`;
          }
        }
      } catch (e) {
        console.log("Using default preset deal data.");
      }
    }

    document.getElementById('copyShareBtn').addEventListener('click', () => {
      const brand = document.getElementById('brandName').innerText;
      const price = document.getElementById('dealPrice').innerText;
      const text = `The Vitamin Shoppe $1 Weekend Deal: ${brand} for ${price}! (Limit 6)`;
      navigator.clipboard.writeText(text).then(() => {
        const label = document.getElementById('copyBtnLabel');
        label.innerText = '✓ Copied to Clipboard!';
        setTimeout(() => { label.innerText = '📋 Copy Deal to Share'; }, 2000);
      }).catch(() => {
        alert('Copy this deal: ' + text);
      });
    });

    loadDealsData();
  </script>
</body>
</html>
