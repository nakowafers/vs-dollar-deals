<!-- ===== VARIANT C: Grab List ===== -->
<style>
  /* ---- Scoped to #view-c ---- */
  #view-c {
    --vc-bg: #ffffff;
    --vc-ink: #101418;
    --vc-ink-soft: #5b6470;
    --vc-line: #e7ebef;
    --vc-accent: #0b7a3b;
    --vc-accent-dark: #085b2c;
    --vc-featured-bg: #0b2e1a;
    --vc-featured-ink: #eafff1;
    --vc-price-bg: #101418;
    --vc-price-ink: #ffffff;
    --vc-font-sans: 'Inter', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --vc-font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;

    min-height: 100vh;
    background: var(--vc-bg);
    color: var(--vc-ink);
    font-family: var(--vc-font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #view-c *,
  #view-c *::before,
  #view-c *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* ---- Full-bleed wrapper + inner column ---- */
  #view-c .vc-wrap {
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(180deg, #f7f9fa 0%, #ffffff 220px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 96px;
  }

  #view-c .vc-inner {
    width: 100%;
    max-width: 760px;
  }

  /* ---- Top header ---- */
  #view-c .vc-head {
    padding: 28px 0 20px;
    border-bottom: 3px solid var(--vc-ink);
  }

  #view-c .vc-head-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  #view-c .vc-title {
    font-family: var(--vc-font-display);
    font-weight: 700;
    font-size: 2rem;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--vc-ink);
  }

  #view-c .vc-dates {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--vc-ink-soft);
    white-space: nowrap;
  }

  /* ---- Deal rows ---- */
  #view-c .vc-row {
    display: grid;
    grid-template-columns: 92px 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 20px 0;
    border-bottom: 1px solid var(--vc-line);
  }

  #view-c .vc-row:last-of-type {
    border-bottom: none;
  }

  /* Price block */
  #view-c .vc-price {
    grid-row: 1 / span 2;
    align-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 72px;
    background: var(--vc-price-bg);
    color: var(--vc-price-ink);
    border-radius: 8px;
    font-family: var(--vc-font-display);
    font-weight: 700;
    font-size: 1.9rem;
    letter-spacing: -0.02em;
  }

  /* Featured ($1) row dominance */
  #view-c .vc-row.vc-featured {
    grid-template-columns: 92px 1fr auto;
    background: var(--vc-featured-bg);
    color: var(--vc-featured-ink);
    margin: 0 -16px;
    padding: 20px 16px;
    border-radius: 12px;
    border-bottom: none;
    position: relative;
  }

  #view-c .vc-row.vc-featured + .vc-row {
    margin-top: 20px;
  }

  #view-c .vc-row.vc-featured .vc-price {
    background: var(--vc-accent);
    color: #ffffff;
  }

  #view-c .vc-row.vc-featured .vc-meta,
  #view-c .vc-row.vc-featured .vc-limit {
    color: rgba(234, 255, 241, 0.75);
  }

  #view-c .vc-row.vc-featured .vc-flag {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #ffffff;
    background: var(--vc-accent);
    padding: 3px 7px;
    border-radius: 4px;
    margin-right: 8px;
    vertical-align: 1px;
  }

  /* Body of the row */
  #view-c .vc-name {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  #view-c .vc-brand {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--vc-ink-soft);
    margin-bottom: 3px;
  }

  #view-c .vc-row.vc-featured .vc-brand {
    color: rgba(234, 255, 241, 0.6);
  }

  #view-c .vc-meta {
    font-size: 0.86rem;
    line-height: 1.45;
    color: var(--vc-ink-soft);
    margin-top: 2px;
  }

  #view-c .vc-limit {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--vc-accent-dark);
    margin-top: 6px;
  }

  /* Checklist affordance (read-only) */
  #view-c .vc-check {
    grid-column: 3;
    grid-row: 1 / span 2;
    align-self: center;
    width: 22px;
    height: 22px;
    border: 2px solid var(--vc-ink-soft);
    border-radius: 6px;
    opacity: 0.55;
  }

  #view-c .vc-row.vc-featured .vc-check {
    border-color: #ffffff;
    opacity: 0.4;
  }

  /* ---- Summary footer ---- */
  #view-c .vc-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
    padding: 14px 0;
    border-top: 2px solid var(--vc-ink);
  }

  #view-c .vc-count {
    font-size: 0.86rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--vc-ink);
  }

  #view-c .vc-total {
    font-family: var(--vc-font-display);
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    color: var(--vc-accent-dark);
  }

  /* ---- Responsive ---- */
  @media (min-width: 640px) {
    #view-c .vc-title {
      font-size: 2.5rem;
    }
    #view-c .vc-price {
      height: 84px;
      font-size: 2.4rem;
    }
    #view-c .vc-name {
      font-size: 1.2rem;
    }
    #view-c .vc-meta {
      font-size: 0.95rem;
    }
    #view-c .vc-limit {
      font-size: 0.85rem;
    }
    #view-c .vc-row.vc-featured {
      margin: 0 -24px;
      padding: 24px 24px;
    }
  }

  @media (max-width: 430px) {
    #view-c .vc-row {
      grid-template-columns: 76px 1fr auto;
      gap: 12px;
    }
    #view-c .vc-row.vc-featured {
      grid-template-columns: 76px 1fr auto;
    }
    #view-c .vc-price {
      height: 60px;
      font-size: 1.6rem;
    }
    #view-c .vc-name {
      font-size: 0.98rem;
    }
  }
</style>

<section id="view-c" class="variant-view" aria-label="Variant C: Grab List">
  <div class="vc-wrap">
    <div class="vc-inner">

      <header class="vc-head">
        <div class="vc-head-top">
          <h1 class="vc-title">$1 Dollar Deals</h1>
          <span class="vc-dates">Thu 9/10 &ndash; Sun 9/13</span>
        </div>
      </header>

      <div class="vc-row vc-featured">
        <div class="vc-price" aria-hidden="true">$1</div>
        <div class="vc-info">
          <div class="vc-brand"><span class="vc-flag">Featured</span>Jocko GO</div>
          <div class="vc-name">Jocko GO Energy Drink &mdash; 12oz Single</div>
          <div class="vc-meta">This week's featured $1 energy drink of the week</div>
          <div class="vc-limit">Limit 6 per customer</div>
        </div>
        <div class="vc-check" aria-hidden="true"></div>
      </div>

      <div class="vc-row">
        <div class="vc-price" aria-hidden="true">$2</div>
        <div class="vc-info">
          <div class="vc-brand">Jocko Molk</div>
          <div class="vc-name">Jocko Molk RTD Protein Shake</div>
          <div class="vc-meta">Plus $2 Jocko Molk protein shakes, same weekend window</div>
          <div class="vc-limit">Limit 6 per customer</div>
        </div>
        <div class="vc-check" aria-hidden="true"></div>
      </div>

      <footer class="vc-summary">
        <span class="vc-count">2 offers</span>
        <span class="vc-total">from $1</span>
      </footer>

    </div>
  </div>
</section>
