name: Update Vitamin Shoppe Deals

on:
  schedule:
    # Runs every Thursday at 12:00 PM UTC (8:00 AM EST)
    - cron: '0 12 * * 4'
    # Runs every Friday at 12:00 PM UTC as a fallback check
    - cron: '0 12 * * 5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python3 scraper.py

      - name: Commit and push if deals changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): auto-update deals.json [skip ci]" && git push)
